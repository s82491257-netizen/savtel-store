

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savage's Pre Order - Arm To Serve</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#080b12;color:#fff}header{padding:15px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#080b12;z-index:10}.brand{font-weight:900;letter-spacing:2px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding:30px 5%}.card{background:#111827;border:1px solid #222;padding:15px;border-radius:10px}.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}button{background:#8ab4ff;color:#000;border:0;padding:10px 15px;border-radius:20px;font-weight:700;cursor:pointer;margin-top:8px}#cart{position:fixed;right:10px;bottom:10px;background:#fff;color:#000;padding:15px;border-radius:10px;width:300px;display:none;max-height:80vh;overflow:auto}#cart.show{display:block}</style></head><body>
<header><div class="brand">SAVAGE'S <small style="display:block;font-size:9px;color:#888">ARM TO SERVE - ATONSU, KUMASI</small></div><div><button onclick="document.getElementById('cart').classList.toggle('show')">Cart (<span id="count">0</span>)</button> <a href="https://wa.me/233257980924" style="color:#8ab4ff;margin-left:10px">WhatsApp</a></div></header>
<div style="padding:40px 5%"><h1>YOUR STYLE. <span style="color:#8ab4ff">YOUR MOVE.</span></h1><p style="color:#aaa">Sneakers, Tops & Furniture - Paystack Secure</p><div><button onclick="filterCat('All')">All</button> <button onclick="filterCat('Sneakers')">Sneakers</button> <button onclick="filterCat('Tops')">Tops</button> <button onclick="filterCat('Furniture')">Furniture</button></div></div>
<div class="products" id="products">Loading...</div>
<div id="cart"><h3>Your Bag</h3><div id="cartItems"></div><p>Total: <b id="total">GH₵0</b></p><input id="cName" placeholder="Full name" style="width:100%;margin:5px 0;padding:8px"><input id="cEmail" placeholder="Email" style="width:100%;margin:5px 0;padding:8px"><input id="cPhone" placeholder="Phone 0257..." style="width:100%;margin:5px 0;padding:8px"><input id="cAddr" placeholder="Address - Atonsu" style="width:100%;margin:5px 0;padding:8px"><button onclick="checkout()" style="width:100%;background:#8ab4ff">Pay with Paystack</button></div>
<script>
let allProducts=[], cart=[], cat='All';
function gh(n){return 'GH₵'+Number(n).toFixed(2)}
async function load(){try{let r=await fetch('/api/products'); allProducts=await r.json(); render()}catch(e){document.getElementById('products').innerHTML='Failed to load - check Render logs'}}
function render(){let list=cat==='All'?allProducts:allProducts.filter(p=>p.category===cat); document.getElementById('products').innerHTML=list.map(p=>`<div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'"><small style="color:#8ab4ff">${p.category}</small><h3>${p.name}</h3><p style="color:#aaa;font-size:13px">${p.description||''}</p><div style="display:flex;justify-content:space-between;align-items:center"><b>${gh(p.price)}</b><button onclick="add('${p.id}')">Add to Bag</button></div></div>`).join('')}
function filterCat(c){cat=c; render()}
function add(id){let p=allProducts.find(x=>x.id==id); let f=cart.find(x=>x.id==id); if(f) f.qty++; else cart.push({id:p.id, name:p.name, price:p.price, qty:1}); updateCart()}
function updateCart(){document.getElementById('count').textContent=cart.reduce((a,b)=>a+b.qty,0); let total=0; document.getElementById('cartItems').innerHTML=cart.map(c=>{total+=c.price*c.qty; return `<div style="display:flex;justify-content:space-between;margin:8px 0"><span>${c.name} x${c.qty}</span><span>${gh(c.price*c.qty)} <button onclick="cart=cart.filter(x=>x.id!='${c.id}');updateCart()" style="background:none;color:red">x</button></span></div>`}).join('')||'Empty'; document.getElementById('total').textContent=gh(total)}
async function checkout(){let customer={name:document.getElementById('cName').value, email:document.getElementById('cEmail').value, phone:document.getElementById('cPhone').value, address:document.getElementById('cAddr').value}; if(!customer.name||!customer.email||!customer.phone||!customer.address) return alert('Fill all fields'); if(!cart.length) return alert('Cart empty'); let r=await fetch('/api/checkout',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({customer, items:cart})}); let d=await r.json(); if(!r.ok) return alert(d.error); location.href=d.authorization_url}
load();
</script></body></html>
